[features]
m3-device-check = []

[dependencies]
ct-core = { path = "../ct-core" }
ct-backend-intel = { path = "../ct-backend-intel" }
ct-ptx = { path = "../ct-ptx" }
ct-codegen-spirv = { path = "../ct-codegen-spirv" }
ct-fatbin = { path = "../ct-fatbin" }
